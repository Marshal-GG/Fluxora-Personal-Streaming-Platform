name: Server CI

on:
  push:
    paths:
      - 'apps/server/**'
  pull_request:
    paths:
      - 'apps/server/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/server/pyproject.toml

      - name: Install FFmpeg
        # Several tests in test_stream.py call `_build_ffmpeg_cmd` which
        # invokes `_ffmpeg_bin()` → `shutil.which("ffmpeg")`. The runner
        # image doesn't include FFmpeg by default. Tests build the
        # command string only — they don't execute it — but the path
        # lookup must succeed. Cheaper than mocking `_ffmpeg_bin` across
        # ~30 test cases. `--no-install-recommends` skips the suggested-
        # codecs metapackages we don't need (saves ~120 MB).
        # Path filter on this workflow restricts triggers to
        # `apps/server/**`, so this install only runs when relevant.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Format check (black)
        run: python -m black --check .

      - name: Tests (pytest)
        run: python -m pytest tests/ -v

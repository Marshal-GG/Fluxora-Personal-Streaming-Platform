org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Disable Kotlin incremental compilation on this project.  The Kotlin
# Gradle plugin's RelocatableFileToPathConverter computes paths via
# Java's File.relativeTo, which throws IllegalArgumentException on
# Windows when the source file and the project root sit on different
# drive letters — common here because pub cache lives at
# C:\Users\<u>\AppData\Local\Pub\Cache and this project lives on F:\.
# The build still produces a working APK either way (the failure is
# during the cache-flush phase, after compilation), but disabling the
# incremental cache silences the noisy stack traces and avoids any
# scenario where a corrupted incremental snapshot wedges a future
# build.  Cost: full Kotlin recompiles instead of incremental ones,
# which costs ~few-second extra per build for the small amount of
# Kotlin we ship (multicast lock + PIP method channels in
# MainActivity.kt; everything else is plugin-side and already
# compiled to JARs).  Worth it for build-log readability.
kotlin.incremental=false

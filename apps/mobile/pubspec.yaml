name: fluxora_mobile
description: Fluxora mobile client for iOS and Android
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  fluxora_core:
    path: ../../packages/fluxora_core
  flutter_bloc: ^9.1.1
  go_router: ^17.2.3
  get_it: ^7.6.7
  multicast_dns: ^0.3.2
  flutter_secure_storage: ^9.0.0
  logger: ^2.7.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  cached_network_image: ^3.4.1
  flutter_webrtc: ^1.4.1
  google_fonts: ^8.1.0
  lucide_icons_flutter: ^3.1.13
  screen_brightness: ^2.1.7
  mobile_scanner: ^7.1.2
  audio_service: ^0.18.18
  package_info_plus: ^9.0.1
  just_audio: ^0.10.5
  pdfx: ^2.9.2
  photo_view: ^0.15.0
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  connectivity_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
